# Camino a Guía Mayor (Amigo -> Guía Mayor): 39 requisitos individuales + 2 Maestrías.
# "hecho" se calcula en home.html comparando nombre/opciones contra especialidades ya documentadas,
# no contra el campo codigo (los libros DSA repiten prefijos de 2 letras entre áreas distintas,
# ej. AM se usa tanto para Artes y Actividades Manuales como para Actividades Misioneras).
guia_mayor:
  requisitos:
    - nombre: Campamento I
      area: AR
      clase: Amigo
    - nombre: Arte de acampar
      area: AR
      clase: Amigo Avanzada
    - nombre: Caminata con mochila
      area: AR
      clase: Compañero Avanzada
    - nombre: Rescate básico
      area: CS
      clase: Pionero
    - nombre: Civismo cristiano
      area: MC
      clase: Pionero Avanzada
    - nombre: Orientación
      area: AR
      clase: Pionero Avanzada
    - nombre: Fogatas y cocina al aire libre
      area: AR
      clase: Pionero Avanzada
    - nombre: Temperancia
      area: AM
      clase: Excursionista
    - nombre: Aventurero para Cristo
      area: MC
      clase: Excursionista
    - nombre: Construcciones rústicas
      area: AR
      clase: Excursionista
    - nombre: Testificación de menores
      area: MC
      clase: Excursionista Avanzada
    - nombre: Orden cerrado
      area: AR
      clase: Excursionista Avanzada
    - nombre: Vida silvestre
      area: AR
      clase: Excursionista Avanzada
    - nombre: Mayordomía
      area: MC
      clase: Guía Avanzada
    - nombre: Liderazgo al aire libre
      area: AR
      clase: Guía Avanzada
    - nombre: Presupuesto familiar
      area: HD
      clase: Guía Avanzada
    - nombre: Arte de contar historias cristianas
      area: MC
      clase: Guía Mayor
    - nombre: "Natación - Principiante I, Aptitud física, Nudos y amarras o Seguridad básica en el agua"
      area: AR
      clase: Amigo
      opciones: ["Natación - Principiante I", "Aptitud física", "Nudos y amarras", "Seguridad básica en el agua"]
    - nombre: "Natación - Principiante II o Campamento II"
      area: AR
      clase: Compañero
      opciones: ["Natación - Principiante II", "Campamento II"]
    - nombre: "Anfibios, Aves, Aves domésticas, Ganadería, Reptiles, Moluscos, Árboles o Arbustos"
      area: EN
      clase: Compañero
      opciones: ["Anfibios", "Aves", "Aves domésticas", "Ganadería", "Reptiles", "Moluscos", "Árboles", "Arbustos"]
    - nombre: "Campamento III o Primeros auxilios - Básico"
      area: AR
      clase: Explorador
      opciones: ["Campamento III", "Primeros auxilios"]
    - nombre: "Astronomía, Cactus, Climatología, Flores o Rastreo de animales"
      area: EN
      clase: Explorador
      opciones: ["Astronomía", "Cactus", "Climatología", "Flores", "Rastreo de animales"]
    - nombre: "Modales cristianos o Vida familiar"
      area: MC
      clase: Explorador Avanzada
      opciones: ["Modales cristianos", "Vida familiar"]
    - nombre: "Nutrición o Educación física"
      area: CS
      clase: Guía
      opciones: ["Nutrición", "Educación física"]
    - nombre: "Ecología o Conservación ambiental"
      area: EN
      clase: Guía
      opciones: ["Ecología", "Conservación ambiental"]

