<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="utf-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>{% if page.title %}{{ page.title | escape }}{% else %}{{ site.title | escape }}{% endif %}</title>
    <meta name="description" content="{{ page.excerpt | default: site.description | strip_html | normalize_whitespace | truncate: 160 | escape }}">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@300;400;500;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">

    <!-- Mermaid.js -->
    <script src="https://cdn.jsdelivr.net/npm/mermaid@11.12.1/dist/mermaid.min.js" integrity="sha256-GYsZRC+G8LRqF+VtOr90TDooo0J+ZvqNraO1iad7q8w=" crossorigin="anonymous"></script>
    <script>
      document.addEventListener('DOMContentLoaded', function() {
        if (typeof mermaid !== 'undefined') {
          mermaid.initialize({ startOnLoad: false, theme: 'dark', securityLevel: 'loose' });
          document.querySelectorAll('pre code.language-mermaid').forEach(function(cb) {
            var pre = cb.parentElement;
            var div = document.createElement('div');
            div.className = 'mermaid';
            div.textContent = cb.textContent;
            pre.parentElement.replaceChild(div, pre);
          });
          document.querySelectorAll('pre.mermaid').forEach(function(pb) {
            var div = document.createElement('div');
            div.className = 'mermaid';
            div.textContent = pb.textContent;
            pb.parentElement.replaceChild(div, pb);
          });
          mermaid.run();
        }
      });
    </script>

    <style>
      :root {
        --bg: #0d1117;
        --bg-card: #161b22;
        --border: #30363d;
        --text: #e6edf3;
        --text-dim: #8b949e;
        --green: #3fb950;
        --blue: #58a6ff;
        --amber: #d29922;
      }

      *, *::before, *::after { box-sizing: border-box; }

      body {
        font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
        background: var(--bg);
        color: var(--text);
        line-height: 1.7;
        max-width: 860px;
        margin: 0 auto;
        padding: 24px 20px;
      }

      h1, h2, h3, h4, h5, h6 {
        font-family: 'JetBrains Mono', monospace;
        color: var(--green);
        margin-top: 1.5em;
        margin-bottom: 0.5em;
      }
      h1 { font-size: 1.6rem; border-bottom: 1px solid var(--border); padding-bottom: 8px; }
      h2 { font-size: 1.3rem; }
      h3 { font-size: 1.1rem; color: var(--text); }

      a { color: var(--blue); text-decoration: none; }
      a:hover { color: var(--green); text-decoration: underline; }

      img {
        max-width: 100%;
        height: auto;
        border-radius: 6px;
      }

      .mermaid { text-align: center; margin: 20px 0; }

      table {
        border-collapse: collapse;
        width: 100%;
        margin: 16px 0;
        font-size: 0.9rem;
      }
      table, th, td { border: 1px solid var(--border); }
      th, td { padding: 10px 12px; text-align: left; }
      th { background: var(--bg-card); color: var(--green); font-weight: 600; }
      tr:nth-child(even) { background: rgba(22,27,34,0.5); }

      blockquote {
        border-left: 3px solid var(--green);
        margin: 16px 0;
        padding: 8px 16px;
        background: rgba(63,185,80,0.06);
        color: var(--text-dim);
      }

      code {
        background: var(--bg-card);
        padding: 2px 6px;
        border-radius: 4px;
        font-family: 'JetBrains Mono', monospace;
        font-size: 0.85em;
        border: 1px solid var(--border);
      }

      pre {
        background: var(--bg-card);
        padding: 16px;
        border-radius: 8px;
        overflow-x: auto;
        border: 1px solid var(--border);
      }
      pre code { background: transparent; padding: 0; border: none; }

      hr {
        border: none;
        border-top: 1px solid var(--border);
        margin: 24px 0;
      }

      ul, ol { padding-left: 1.5em; }
      li { margin: 4px 0; }

      details {
        margin: 8px 0;
        padding: 8px 12px;
        background: var(--bg-card);
        border: 1px solid var(--border);
        border-radius: 6px;
      }
      summary {
        cursor: pointer;
        font-weight: 600;
        color: var(--green);
      }

      /* Navigation breadcrumb */
      .nav-back {
        font-family: 'JetBrains Mono', monospace;
        font-size: 0.8rem;
        color: var(--text-dim);
        margin-bottom: 16px;
        padding-bottom: 8px;
        border-bottom: 1px dashed var(--border);
      }
      .nav-back a { color: var(--text-dim); }
      .nav-back a:hover { color: var(--green); }

      @media print {
        body { background: white; color: black; }
        h1, h2, h3 { color: #333; }
        a { color: #333; }
        table, th, td { border-color: #ccc; }
        th { background: #f5f5f5; color: #333; }
        blockquote { border-color: #999; background: #f9f9f9; color: #555; }
      }
    </style>
  </head>
  <body>
    <div class="nav-back">
      <a href="{{ site.baseurl }}/">← inicio</a>
    </div>
    {{ content }}
  </body>
</html>
